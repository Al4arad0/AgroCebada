# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: barley_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: barley_yield_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://barley_admin:secret_password@db:5432/barley_yield_db
    depends_on:
      - db

  ml-engine:
    build: ./ml
    ports:
      - "8000:8000"
    environment:
      - ML_ENV=development

volumes:
  pg_data: